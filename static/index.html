<!DOCTYPE html>
<html lang='pt-br'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>PratiCão</title>
</head>
<body>
  <h1>PratiCão</h1>
  <h2>Nossos serviços</h2>
  <ul id='lista'></ul>
  <script>
    fetch('/servicos')
      .then(r => r.json())
      .then(servicos => {
        const lista = document.getElementById('lista');
        servicos.forEach(s => {
          const li = document.createElement('li');
          li.textContent = s.nome + ' - R$ ' + s.preco + ' (' + s.duracao_min + ' min)';
          lista.appendChild(li);
        });
      });
  </script>
</body>
</html>
