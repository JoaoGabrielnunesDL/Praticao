services:
  db:
    image: postgres:16
    container_name: praticao-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praticao123}
      POSTGRES_DB: ${POSTGRES_DB:-praticao}
    ports:
      - "5433:5432"
    volumes:
      - praticao_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-praticao}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  praticao_dados: