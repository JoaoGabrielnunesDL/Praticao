<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessão expirada - PratiCão</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/estados.css">
  <link rel="stylesheet" href="css/estados-paginas.css">
</head>
<body class="pg-estado pg-sessao-expirada">
  <header id="cabecalho"></header>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ic-pata" viewBox="0 0 64 64">
      <ellipse cx="13" cy="29" rx="6" ry="8" transform="rotate(-20 13 29)"/>
      <ellipse cx="24" cy="15" rx="6.5" ry="8.5" transform="rotate(-8 24 15)"/>
      <ellipse cx="40" cy="15" rx="6.5" ry="8.5" transform="rotate(8 40 15)"/>
      <ellipse cx="51" cy="29" rx="6" ry="8" transform="rotate(20 51 29)"/>
      <path d="M32 31c-9.5 0-18 10.5-18 19 0 6 4.6 8.5 9 8.5 4.2 0 5.8-2.3 9-2.3s4.8 2.3 9 2.3c4.4 0 9-2.5 9-8.5 0-8.5-8.5-19-18-19z"/>
    </symbol>
  </svg>

  <main class="estado-pagina">
    <div class="ep-deco" aria-hidden="true">
      <svg class="pata-deco p1"><use href="#ic-pata"/></svg>
      <svg class="pata-deco p2"><use href="#ic-pata"/></svg>
      <svg class="pata-deco p3"><use href="#ic-pata"/></svg>
      <svg class="pata-deco p4"><use href="#ic-pata"/></svg>
      <svg class="onda" viewBox="0 0 400 160" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad-onda" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#f28a0c"/>
            <stop offset="1" stop-color="#ffb23a"/>
          </linearGradient>
        </defs>
        <path d="M0 160C90 150 150 120 210 80S330 10 400 0V160Z" fill="url(#grad-onda)"/>
      </svg>
      <svg class="pata-onda"><use href="#ic-pata"/></svg>
    </div>

    <section class="estado-cartao" aria-labelledby="t-estado">
      <div class="icone" aria-hidden="true">
        <!-- Relógio com alerta -->
        <svg viewBox="0 0 64 64">
          <circle cx="29" cy="32" r="22" fill="none" stroke="#1b63e6" stroke-width="5.5"/>
          <path d="M29 19v14l9 6" fill="none" stroke="#1b63e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="49" cy="48" r="12" fill="#f28a0c" stroke="#fff" stroke-width="3"/>
          <path d="M49 41.5v7.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
          <circle cx="49" cy="54" r="2.1" fill="#fff"/>
        </svg>
      </div>
      <h1 id="t-estado">Sua sessão expirou.</h1>
      <p>Entre novamente para continuar usando o sistema.</p>
      <a class="btn btn-laranja" id="btn-principal" href="login.html">➜ Ir para o login</a>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>Auth.limpar(); // a sessão não vale mais: apaga o token antes de montar o cabeçalho</script>
  <script src="js/header.js"></script>
  <script src="js/paginas-estado.js"></script>
</body>
</html>
