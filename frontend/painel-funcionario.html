<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda do Dia - PratiCão</title>
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/agenda.css">
  <link rel="stylesheet" href="css/estados.css">
  <link rel="stylesheet" href="css/estados-componentes.css">
  <link rel="stylesheet" href="css/praticao-ui.css">
  <link rel="stylesheet" href="css/admin-cenario.css">
</head>
<body class="pg-agenda ui-estados">
  <header id="cabecalho"></header>

  <!-- Ícones só visuais, reaproveitados com <use>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ic-pata" viewBox="0 0 64 64">
      <ellipse cx="13" cy="29" rx="6" ry="8" transform="rotate(-20 13 29)"/>
      <ellipse cx="24" cy="15" rx="6.5" ry="8.5" transform="rotate(-8 24 15)"/>
      <ellipse cx="40" cy="15" rx="6.5" ry="8.5" transform="rotate(8 40 15)"/>
      <ellipse cx="51" cy="29" rx="6" ry="8" transform="rotate(20 51 29)"/>
      <path d="M32 31c-9.5 0-18 10.5-18 19 0 6 4.6 8.5 9 8.5 4.2 0 5.8-2.3 9-2.3s4.8 2.3 9 2.3c4.4 0 9-2.5 9-8.5 0-8.5-8.5-19-18-19z"/>
    </symbol>
  </svg>

  <main class="pagina agenda">
    <!-- Decoração de fundo (patinhas e onda laranja): não interfere na tela -->
    <div class="ag-deco" aria-hidden="true">
      <!-- Cenário pet (admin-cenario.css): formas orgânicas atrás dos cartões + patinhas, ossinhos, coração e brilhos nas áreas livres -->
      <div class="cn-cena"><span class="cn-forma f-onda s1"></span><span class="cn-forma f-mancha s2"></span><span class="cn-forma f-curva s3"></span><span class="cn cn-osso t1 m1"></span><span class="cn cn-coracao tl m2"></span><span class="cn cn-trilha t3 m3"></span><span class="cn cn-brilho tl m4"></span><span class="cn cn-pata t1 m5"></span><span class="cn cn-osso t2 m6"></span><span class="cn cn-tracos tl m7"></span><span class="cn cn-brilho t2 m8"></span></div>
      <svg class="pata-deco p1"><use href="#ic-pata"/></svg>
      <svg class="pata-deco p2"><use href="#ic-pata"/></svg>
      <svg class="pata-deco p3"><use href="#ic-pata"/></svg>
      <svg class="pata-deco p4"><use href="#ic-pata"/></svg>
      <svg class="pata-deco p5"><use href="#ic-pata"/></svg>
      <svg class="onda" viewBox="0 0 400 160" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad-onda" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#f7931e"/>
            <stop offset="1" stop-color="#ffb347"/>
          </linearGradient>
        </defs>
        <path d="M0 160C90 150 150 120 210 80S330 10 400 0V160Z" fill="url(#grad-onda)"/>
      </svg>
      <svg class="pata-onda"><use href="#ic-pata"/></svg>
      <!-- Kit pet shop (praticao-ui.css): enfeites na faixa livre abaixo da tabela, à esquerda -->
      <span class="pc-d pc-f-calendario ag-d-cal"></span>
      <span class="pc-d pc-f-coracao ag-d-coracao"></span>
      <span class="pc-d pc-f-pata ag-d-pata1"></span>
      <span class="pc-d pc-f-pata ag-d-pata2"></span>
    </div>

    <div class="container ag-container">
      <!-- Ilustração dos pets com a prancheta (somente decorativa) -->
      <aside class="ag-pets" aria-hidden="true">
        <svg class="prancheta" viewBox="0 0 64 72">
          <rect x="6" y="8" width="52" height="60" rx="10" fill="#1f6fe5"/>
          <rect x="11" y="14" width="42" height="49" rx="6" fill="#fff"/>
          <rect x="21" y="3" width="22" height="12" rx="5" fill="#0b3a9e"/>
          <use href="#ic-pata" x="18" y="24" width="28" height="28" fill="#1f6fe5"/>
        </svg>
        <img src="img/dicas/WhatsApp%20Image%202026-11-18%20at%2020.11.15.jpeg" alt="" decoding="async">
      </aside>

      <div class="ag-conteudo">
        <div class="ag-topo">
          <p class="selo-op" id="selo-pagina">Operação</p>
          <h1 id="titulo-pagina">Agenda do Dia</h1>
          <p class="sub" id="sub-pagina">Acompanhe e atualize os atendimentos.</p>
        </div>

        <div id="mensagem" class="mensagem" aria-live="polite" hidden></div>

        <form id="filtro-data" class="filtro">
          <span class="ag-data">
            <svg class="ag-data-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M12 14h2M8 17h2"/></svg>
            <label for="data">Data:</label>
            <input type="date" id="data" required>
          </span>
          <button class="btn btn-laranja" type="submit"><svg class="btn-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg>Filtrar</button>
          <button class="btn btn-contorno" type="button" id="btn-hoje">Hoje</button>
          <button class="btn btn-contorno" type="button" data-atalho="7dias" aria-pressed="false">Últimos 7 dias</button>
          <button class="btn btn-contorno" type="button" data-atalho="mes" aria-pressed="false">Último mês</button>
        </form>
        <p class="sub" id="info-periodo" aria-live="polite" hidden></p>

        <!-- Clique em um indicador para filtrar a lista por status -->
        <div class="indicadores">
          <button type="button" class="ind ativo" data-filtro="TODOS"><strong>0</strong>Total</button>
          <button type="button" class="ind" data-filtro="AGENDADO"><strong>0</strong>Pendentes</button>
          <button type="button" class="ind" data-filtro="CONFIRMADO"><strong>0</strong>Confirmados</button>
          <button type="button" class="ind" data-filtro="CONCLUIDO"><strong>0</strong>Concluídos</button>
          <button type="button" class="ind" data-filtro="CANCELADO"><strong>0</strong>Cancelados</button>
        </div>

        <div id="lista" class="lista"></div>
      </div>
    </div>
  </main>

  <!-- Painel de detalhes (abre ao clicar em um agendamento) -->
  <dialog id="dlg-detalhes" class="painel" aria-labelledby="det-titulo">
    <h2 id="det-titulo">Detalhes do agendamento</h2>
    <div id="det-conteudo"></div>
    <div class="rodape-dlg">
      <span id="det-acoes" class="acoes"></span>
      <form method="dialog"><button class="btn btn-contorno">Fechar</button></form>
    </div>
  </dialog>

  <!-- Confirmação (cancelar e concluir) -->
  <dialog id="dlg-confirmar" aria-labelledby="conf-titulo">
    <form method="dialog">
      <h2 id="conf-titulo"></h2>
      <p id="conf-texto" class="sub"></p>
      <dl class="dados" id="conf-dados"></dl>
      <div class="rodape-dlg">
        <button class="btn btn-contorno" value="voltar">Voltar</button>
        <button class="btn btn-laranja" value="ok" id="conf-ok"></button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/estados.js"></script>
  <script src="js/header.js"></script>
  <script src="js/agenda.js"></script>
</body>
</html>
